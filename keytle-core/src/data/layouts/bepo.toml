id = "bepo"
name = "Bépo"
description = "The French ergonomic layout: home row vowels, altgr accents."
rows = 5
row_offset = [0, 1, 1, 1, 2]

[[key]]
row = 0
col = 0
base = "$"
shift = "#"
altgr = "–"
finger = "left-pinky"

[[key]]
row = 0
col = 1
base = "\""
shift = "1"
altgr = "—"
finger = "left-pinky"

[[key]]
row = 0
col = 2
base = "«"
shift = "2"
altgr = "<"
finger = "left-ring"

[[key]]
row = 0
col = 3
base = "»"
shift = "3"
altgr = ">"
finger = "left-middle"

[[key]]
row = 0
col = 4
base = "("
shift = "4"
altgr = "["
finger = "left-index"

[[key]]
row = 0
col = 5
base = ")"
shift = "5"
altgr = "]"
finger = "left-index"

[[key]]
row = 0
col = 6
base = "@"
shift = "6"
altgr = "^"
finger = "right-index"

[[key]]
row = 0
col = 7
base = "+"
shift = "7"
altgr = "±"
finger = "right-index"

[[key]]
row = 0
col = 8
base = "-"
shift = "8"
altgr = "−"
finger = "right-middle"

[[key]]
row = 0
col = 9
base = "/"
shift = "9"
altgr = "÷"
finger = "right-ring"

[[key]]
row = 0
col = 10
base = "*"
shift = "0"
altgr = "×"
finger = "right-pinky"

[[key]]
row = 0
col = 11
base = "="
shift = "°"
altgr = "≠"
finger = "right-pinky"

[[key]]
row = 0
col = 12
base = "%"
shift = "`"
altgr = "‰"
