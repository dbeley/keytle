id = "azerty"
name = "AZERTY (French)"
description = "The legacy French layout, as found on most French keyboards."
rows = 5
row_offset = [0, 1, 1, 1, 2]

[[key]]
row = 0
col = 0
base = "²"
finger = "left-pinky"

[[key]]
row = 0
col = 1
base = "&"
shift = "1"
finger = "left-pinky"

[[key]]
row = 0
col = 2
base = "é"
shift = "2"
finger = "left-ring"

[[key]]
row = 0
col = 3
base = "\""
shift = "3"
finger = "left-middle"

[[key]]
row = 0
col = 4
base = "'"
shift = "4"
finger = "left-index"

