[workspace]
resolver = "2"
members = ["keytle-core", "keytle"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
rust-version = "1.85"

[workspace.dependencies]
clap = { version = "4", features = ["derive"] }
keytle-core = { path = "keytle-core" }
rand = { version = "0.10", default-features = false, features = ["std"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
toml = "0.8"

[profile.release]
lto = "thin"
codegen-units = 1
panic = "abort"
