name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  nix:
    name: nix (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # The flake is evaluated for every supported system but only built here.
        os: [ubuntu-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: cachix/install-nix-action@v30
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      - name: Flake check (fmt, clippy, test, packages, shells)
        run: nix flake check --print-build-logs

      - name: Build
        run: nix build .# --print-build-logs

      - name: Smoke test
        run: ./result/bin/keytle --version
